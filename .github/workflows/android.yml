name: Android port
on:
  push:
    branches: [arena/01a0814e-san]
    paths-ignore: ['deliverables/**', 'docs/inspection/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-port-session
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          mkdir -p deliverables
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 2>&1 | tee deliverables/sdk-log.txt
      - name: Inventory and build
        run: |
          python3 scripts/inspect_game.py > /tmp/inspection.log
          gradle wrapper --gradle-version 8.13 2>&1 | tee deliverables/build-log.txt
          ./gradlew testDebugUnitTest assembleDebug bundleRelease --stacktrace 2>&1 | tee -a deliverables/build-log.txt
          python3 scripts/verify_package.py app/build/outputs/apk/debug/app-debug.apk > deliverables/apk-verification.json
          python3 scripts/verify_package.py app/build/outputs/bundle/release/app-release.aab > deliverables/aab-verification.json
          cp app/build/outputs/bundle/release/app-release.aab deliverables/san-offline-unsigned.aab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew connectedDebugAndroidTest --stacktrace; RESULT=$?; mkdir -p deliverables/evidence/android10; adb pull /data/local/tmp/san-evidence/. deliverables/evidence/android10/ || true; adb logcat -d > deliverables/evidence/android10-logcat.txt; cp -r app/build/outputs/androidTest-results/connected deliverables/android10-results || true; exit $RESULT
      - name: Test on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew connectedDebugAndroidTest --rerun-tasks --stacktrace; RESULT=$?; mkdir -p deliverables/evidence/android16; adb pull /data/local/tmp/san-evidence/. deliverables/evidence/android16/ || true; adb logcat -d > deliverables/evidence/android16-logcat.txt; cp -r app/build/outputs/androidTest-results/connected deliverables/android16-results || true; exit $RESULT
      - name: Create initial signed release after tests pass
        run: bash scripts/create_initial_release.sh
      - name: Package build outputs
        if: always()
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/san-offline-test.apk || true
          cp -r app/build/test-results/testDebugUnitTest deliverables/unit-results || true
          find deliverables -type f -name '*.apk' -o -name '*.aab' | sort | xargs -r sha256sum > deliverables/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-port-build
          path: |
            deliverables/
            app/build/reports/
      - name: Save requested deliverables on session branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables docs/asset-inventory.json
          if [ -f gradlew ]; then git add gradlew gradlew.bat gradle/wrapper; fi
          git diff --cached --quiet || git commit -m 'Record Android build outputs and emulator evidence'
          git push origin HEAD:arena/01a0814e-san
