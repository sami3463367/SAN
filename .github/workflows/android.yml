name: Android port
on:
  push:
    branches: [arena/01a0814e-san]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect original bytecode
        run: |
          mkdir -p docs/inspection
          curl -fL https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o /tmp/cfr.jar
          java -jar /tmp/cfr.jar app/libs/original-game.jar --outputdir /tmp/decompiled --silent true
          cp /tmp/decompiled/*.java docs/inspection/
          javap -classpath app/libs/original-game.jar -c -p h > docs/inspection/h.bytecode.txt
          javap -classpath app/libs/original-game.jar -c -p SaintsRow2 > docs/inspection/entrypoint.bytecode.txt
      - name: Save inspection on session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/inspection
          git diff --cached --quiet || git commit -m 'Document original game bytecode inspection'
          git push origin HEAD:arena/01a0814e-san
